<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Patas de Ouro 3 v1.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 bg-cover bg-center bg-fixed relative" style="background-image: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.88)), url('bg.jpg');">

  <!-- Header -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 py-6 px-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="patas-3-log.png" alt="Patas de Ouro 3 Logo" class="h-12 w-auto object-contain" onerror="this.style.display='none'">
        <div>
          <h1 class="text-2xl font-extrabold text-amber-400">Patas de Ouro 3º Edição</h1>
          <p class="text-xs text-slate-400">Versão 1.2</p>
        </div>
      </div>

      <!-- Filtro de Categorias -->
      <div class="flex flex-wrap gap-2" id="category-tabs">
        <button onclick="setCategory('all')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-amber-500 text-slate-950" data-cat="all">Todas</button>
        <button onclick="setCategory('Inter')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 hover:bg-slate-600" data-cat="Inter">Inter</button>
        <button onclick="setCategory('Advanced')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 hover:bg-slate-600" data-cat="Advanced">Advanced</button>
        <button onclick="setCategory('Expert')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 hover:bg-slate-600" data-cat="Expert">Expert</button>
        <button onclick="setCategory('CoOp')" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 hover:bg-slate-600" data-cat="CoOp">CoOp</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-8">
    <!-- Campo de Busca -->
    <div class="mb-8">
      <input type="text" id="search-input" oninput="render()" placeholder="🔍 Pesquise por música, nível, fase ou categoria..." 
             class="w-full md:w-3/4 lg:w-1/2 px-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-slate-100 placeholder-slate-400 shadow-lg backdrop-blur">
    </div>

    <!-- Container do Conteúdo -->
    <div id="content" class="space-y-10"></div>
  </main>

  <script>
    
    const greenSongs = [
      "Cynical",
      "Ercitite",
      "Crash Landing Rendezvous",
      "Freedom Dive",
      "Digitalis",
      "We Love Your Step",
      "Blazor",
      "Do The Dance",
      "404 (New Era)",
      "Pull Me Up",
      "Lucky Star",
      "T.B.H.",
      "Bang Bang",
      "Legendary Dominion",
      "Dreamchasers",
      "Kings Tomb",
      "B3",
      "Infinite Enerzy -Overdoze-",
      "Quattourux",
      "Overnight Flower",
      "Punishment Restaurant",
      "The Last Rebellion",
      "Antique Serenade",
      "Super Haraguro Pop",
      "NightTheater",
      "Rise Up",
      "Unfelicitas",
      "Enjoy The Show",
      "Dizzy Dance Street Light"
    ];

    const tournamentData = {
      "Inter": [
        {
          phase: "1ª Fase (Todos)",
          levels: [
            { name: "Single 12", songs: ["Cynical", "Ercitite", "Faster Z", "Fracture Temporelle", "Odin"] },
            { name: "Single 13", songs: ["Arirang", "Binary Star", "Crash Landing Rendezvous", "Freedom Dive", "Mahika"] }
          ]
        },
        {
          phase: "2ª Fase (16 jogadores)",
          levels: [
            { name: "Single 14", songs: ["Digitalis", "Pumptris Quattro", "Spooky Macaron", "Ultimate Eyes", "We Love Your Step"] },
            { name: "Single 15", songs: ["Altale", "Alice in Misanthrope", "Blazor", "Do The Dance", "You And I"] }
          ]
        },
        {
          phase: "3ª Fase (10 jogadores)",
          levels: [
            { name: "Single 16 (2 músicas)", songs: ["404 (New Era)", "Horang Pungryuga", "Sonic Boom", "R.I.P.", "Pull Me Up", "The People Didn't Know"] }
          ]
        },
        {
          phase: "4ª Fase (6 jogadores)",
          levels: [
            { name: "Single 17 (2 músicas)", songs: ["Aragami", "Lucky Star", "T.B.H.", "That Kitty", "Vanish 2", "Violet Perfume"] }
          ]
        }
      ],
      "Advanced": [
        {
          phase: "1ª Fase (Todos)",
          levels: [
            { name: "Single 16", songs: ["Appassionata", "Bang Bang", "Brain Power", "Imaginarized City", "Legendary Dominion"] },
            { name: "Single 17", songs: ["Canon-D", "Dark Side of the Mind", "Etude", "Dreamchasers", "Kings Tomb"] }
          ]
        },
        {
          phase: "2ª Fase (12 jogadores)",
          levels: [
            { name: "Single 18", songs: ["B3", "Infinite Enerzy -Overdose-", "Irellia", "Gargoyle", "Trickl4sh"] },
            { name: "Single 19", songs: ["Hercules", "Murdoch vs Otada", "Quattourux", "Overnight Flower", "Vacuum"] }
          ]
        },
        {
          phase: "3ª Fase (8 jogadores)",
          levels: [
            { name: "Single 20", songs: ["Curiosity Overdrive", "Legendary Dominion", "Neo Catharsis", "T.B.H."] },
            { name: "Single 21", songs: ["Break Through Myself", "Infinity", "Prima Materia"] },
            { name: "Single 21", songs: ["Punishment Restaurant", "The Last Rebellion"] }
          ]
        }
      ],
      "Expert": [
        {
          phase: "1ª Fase (Todos)",
          levels: [
            { name: "Single 18", songs: ["Antique Serenade", "Digitalis", "Ercitite", "Heart Attack", "The Apocalypse"] },
            { name: "Single 19", songs: ["Athenas Shield", "Crash Landing Rendezvous", "Pull Me Up", "Solfeggietto", "Sudden Appearence Image"] }
          ]
        },
        {
          phase: "2ª Fase (12 jogadores)",
          levels: [
            { name: "Single 20", songs: ["Super Haraguro Pop", "B3", "God Mode", "Kings Tomb", "Kugutsu"] },
            { name: "Single 21", songs: ["404 (New era)", "Bang Bang", "Goodtek", "Heliosphere", "NightTheater"] }
          ]
        },
        {
          phase: "3ª Fase (6 jogadores)",
          levels: [
            { name: "Single 22 (2 músicas)", songs: ["Freedom Dive", "Hercules", "R.I.P.", "Rise Up", "Quattourux", "Unfelicitas"] }
          ]
        },
        {
          phase: "4ª Fase (3 jogadores)",
          levels: [
            { name: "Single 23", songs: ["Dead End", "Enjoy The Show", "The Last Rebellion", "Infinite Enerzy -Overdoze-"] },
            { name: "Double 22", songs: ["Blazor", "Dizzy Dance Street Light", "T.B.H.", "Rush Hour"] },
            { name: "Double 23", songs: ["Enjoy The Show", "Cynical", "The Last Rebellion", "See"] }
          ]
        }
      ],
      "CoOp": [
        {
          phase: "1ª Fase (Todos)",
          levels: [
            { name: "Co-Op", songs: ["Adrenaline Blaster", "Beethoven Virus", "Rolling Christmas", "Stardream"] }
          ]
        },
        {
          phase: "2ª Fase (6 duplas)",
          levels: [
            { name: "Co-Op", songs: ["Bang Bang", "Csikos Post", "Pop The Track", "Turkey March"] }
          ]
        }
      ]
    };

    let activeCategory = 'all';

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-amber-500 text-slate-950";
        } else {
          btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 hover:bg-slate-600 text-slate-100";
        }
      });
      render();
    }

    function render() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('content');
      container.innerHTML = '';

      const categoriesToRender = activeCategory === 'all' 
        ? Object.keys(tournamentData) 
        : [activeCategory];

      categoriesToRender.forEach(cat => {
        const catMatches = cat.toLowerCase().includes(query);
        const phases = tournamentData[cat];
        let categoryHasMatch = false;

        const catSection = document.createElement('section');
        catSection.className = 'bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur shadow-xl';

        let html = `<h2 class="text-2xl font-extrabold text-amber-400 mb-6 border-b border-slate-700 pb-3">${cat}</h2>`;
        html += `<div class="space-y-8">`;

        phases.forEach(p => {
          const phaseMatches = p.phase.toLowerCase().includes(query);

          const matchingLevels = p.levels.map(lvl => {
            const lvlMatches = lvl.name.toLowerCase().includes(query);

            if (catMatches || phaseMatches || lvlMatches || query === '') {
              return { name: lvl.name, songs: lvl.songs };
            } else {
              const songs = lvl.songs.filter(s => s.toLowerCase().includes(query));
              return { name: lvl.name, songs };
            }
          }).filter(lvl => lvl.songs.length > 0);

          if (matchingLevels.length > 0) {
            categoryHasMatch = true;
            html += `
              <div class="bg-slate-900/80 rounded-xl p-5 border border-slate-700/80">
                <h3 class="text-lg font-bold text-slate-200 mb-4 border-b border-slate-800 pb-2 flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                  ${p.phase}
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  ${matchingLevels.map(lvl => `
                    <div class="bg-slate-800/80 rounded-lg p-4 border border-slate-700/60">
                      <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-md w-max">
                        ${lvl.name}
                      </div>
                      <div class="flex flex-wrap gap-1.5 mt-3">
                        ${lvl.songs.map(song => {
  const isGreen = greenSongs.includes(song);
  
  if (isGreen) {
    return `
      <span class="border text-xs px-2.5 py-1 rounded-md transition bg-emerald-950/80 border-emerald-500/80 text-emerald-300 font-bold shadow-sm shadow-emerald-900/50 inline-flex items-center gap-1.5">
        ${song}
        <img src="new.png" alt="NEW" class="h-3 w-auto object-contain">
      </span>
    `;
  }

  return `
    <span class="border text-xs px-2.5 py-1 rounded-md transition bg-slate-900 border-slate-700 text-slate-300">
      ${song}
    </span>
  `;
}).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }
        });

        html += `</div>`;
        catSection.innerHTML = html;

        if (categoryHasMatch) {
          container.appendChild(catSection);
        }
      });

      if (container.children.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-12 text-lg">Nenhum resultado encontrado para "<strong>${query}</strong>".</p>`;
      }
    }

    render();
  </script>
</body>
</html>
